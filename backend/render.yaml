services:
  - type: web
    name: paimana-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "bash render-start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite:///data/sih26103.db
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
